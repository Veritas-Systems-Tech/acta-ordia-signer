# ============================================
# Release — acta-ordia-signer
# ============================================
# Triggers on pushing a version tag (v0.1.0, v0.2.0, ...). Builds signed,
# updater-ready bundles for Linux/macOS/Windows and publishes them to our
# own hosting — NOT GitHub Releases. End users never see this repo or
# GitHub at all; it exists purely as a private CI staging ground.
#
# How this works, in two stages:
#
# 1. `build` (matrix, one job per platform): runs `tauri-apps/tauri-action`,
#    which builds the native bundle for that OS AND signs it with the
#    updater's private key (via TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]).
#    It publishes those signed bundles to a temporary, unlisted GitHub
#    Release in THIS PRIVATE REPO — used purely as a well-tested way to get
#    tauri-action's own correctly-generated updater manifest fragment
#    (exact bundle filenames/signature format), rather than us hand-rolling
#    that. This release is never advertised to end users and is deleted by
#    the publish job below once its assets are mirrored elsewhere.
#
# 2. `publish` (needs: build, runs once after all 3 platforms finish):
#    downloads every asset from that temporary release via the GitHub API
#    (authenticated with GITHUB_TOKEN — works fine against our own private
#    repo), rewrites `latest.json`'s URLs to point at our own storage
#    instead of github.com, and uploads everything to a dedicated public
#    Cloud Storage bucket, then deletes the temporary GitHub release + tag.
#
#    Deliberately a GCS bucket, not Firebase Hosting: a Hosting deploy
#    replaces a site's *entire* content on every release, so an independent
#    CI pipeline deploying to the same site as the main app/website would
#    wipe it out on every signer release (and vice versa). GCS uploads are
#    additive, object-by-object — no such risk, and no separate "site" to
#    manage either (just a bucket in the same GCP project the app already
#    uses). Not put behind a Hosting rewrite on the app's own domain either,
#    since that would add a Cloud Function/Run proxy purely to serve large
#    binary downloads — GCS's own public URLs are the simpler, more direct
#    path for this. A friendlier domain can be layered on top later (Cloud
#    CDN + load balancer) without changing anything here.
#
# Required GitHub Secrets (see acta-ordia-signer README for how to obtain):
#   TAURI_SIGNING_PRIVATE_KEY          — from `cargo tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — password for that key (may be empty)
#
# Required one-time GCP setup (same acta-ordia project the main app uses):
#   `gcloud storage buckets create gs://acta-ordia-signer-downloads
#      --project=acta-ordia --location=us-central1 --uniform-bucket-level-access`
#   then grant public read: `gcloud storage buckets add-iam-policy-binding
#      gs://acta-ordia-signer-downloads --member=allUsers --role=roles/storage.objectViewer`
#   WIF (github-actions-pool/github-provider) and the deploying service
#   account (firebase-adminsdk-fbsvc@acta-ordia.iam.gserviceaccount.com,
#   already has project-wide roles/storage.admin) both already cover this
#   repo — no additional grants needed, verified directly against the live
#   IAM policy (provider condition is `repository_owner == 'igor-veritas'`,
#   not scoped per-repo).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libssl-dev libayatana-appindicator3-dev libfuse2
          # Two prior attempts at fixing "failed to run linuxdeploy" (libfuse2
          # alone, then + APPIMAGE_EXTRACT_AND_RUN=1) both still failed on a
          # real release run — tauri-bundler swallows linuxdeploy's actual
          # stderr, so the true root cause was never directly visible. This
          # exact failure mode is widely reported against Ubuntu 24.04
          # GitHub-hosted runners specifically: AppArmor's unprivileged-user-
          # namespace restriction (default-on since 24.04) can still block a
          # subprocess AppImage tooling spawns internally even during
          # self-extraction. Relaxing it is the standard CI workaround.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-release-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build + sign via tauri-action (staged to a temporary private release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy (AppImage bundler) is itself an AppImage, which needs
          # FUSE to mount-and-run — GitHub's ubuntu-latest runners restrict
          # unprivileged FUSE mounting even with libfuse2 installed (confirmed
          # via a real failed release run: "failed to run linuxdeploy" even
          # after adding libfuse2). This makes AppImage tooling self-extract
          # to a temp dir and run directly instead of FUSE-mounting.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          projectPath: src-tauri
          tagName: staging-${{ github.ref_name }}
          releaseName: 'Internal staging — ${{ github.ref_name }} (not for end users)'
          releaseBody: 'Temporary artifact staging for the publish job. Deleted automatically once mirrored to Cloud Storage.'
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true

  publish:
    name: Mirror to Cloud Storage
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all assets from the temporary staging release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mirror/${{ github.ref_name }}
          gh release download "staging-${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir mirror/${{ github.ref_name }} \
            --pattern "*"

      - name: Rewrite latest.json URLs to point at our own bucket
        run: |
          # BASE_URL: update this (and tauri.conf.json's updater endpoint) if
          # a custom domain is later put in front of this bucket.
          BASE_URL="https://storage.googleapis.com/acta-ordia-signer-downloads"
          node -e "
            const fs = require('fs');
            const path = 'mirror/${{ github.ref_name }}/latest.json';
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            const base = '${BASE_URL}/signer/${{ github.ref_name }}';
            for (const key of Object.keys(manifest.platforms)) {
              const entry = manifest.platforms[key];
              const filename = entry.url.split('/').pop();
              entry.url = base + '/' + filename;
            }
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2));
          "
          # Also drop a copy at the stable signer/latest.json path
          # tauri.conf.json's updater endpoint points at (always "the
          # current latest release").
          cp "mirror/${{ github.ref_name }}/latest.json" mirror/${{ github.ref_name }}/latest.json.versioned
          mkdir -p mirror-flat
          cp "mirror/${{ github.ref_name }}"/* mirror-flat/

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/66429062436/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@acta-ordia.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to gs://acta-ordia-signer-downloads
        run: |
          VERSION_DIR="signer/${{ github.ref_name }}"
          gcloud storage cp mirror-flat/latest.json.versioned "gs://acta-ordia-signer-downloads/${VERSION_DIR}/latest.json"
          for f in mirror-flat/*; do
            [ "$(basename "$f")" = "latest.json.versioned" ] && continue
            gcloud storage cp "$f" "gs://acta-ordia-signer-downloads/${VERSION_DIR}/$(basename "$f")"
          done
          # Stable "always the latest" manifest the updater endpoint checks.
          gcloud storage cp mirror-flat/latest.json.versioned "gs://acta-ordia-signer-downloads/signer/latest.json"

      - name: Delete the temporary staging release + tag
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "staging-${{ github.ref_name }}" --repo "${{ github.repository }}" --yes --cleanup-tag || true
