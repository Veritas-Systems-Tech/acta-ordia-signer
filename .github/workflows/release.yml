# ============================================
# Release — acta-ordia-signer
# ============================================
# Triggers on pushing a version tag (v0.1.0, v0.2.0, ...). Builds signed,
# updater-ready bundles for Linux/macOS/Windows and publishes them to our
# own hosting — NOT GitHub Releases. End users never interact with this
# repo or GitHub at all; this release flow exists purely as a CI staging
# ground (temporary releases are deleted once their assets are mirrored —
# see the publish job below).
#
# How this works, in two stages:
#
# 1. `build` (matrix, one job per platform): runs `tauri-apps/tauri-action`,
#    which builds the native bundle for that OS AND signs it with the
#    updater's private key (via TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]).
#    It publishes those signed bundles to a temporary, unlisted GitHub
#    Release in this repo, deleted within the same job run — used purely
#    as a well-tested way to get tauri-action's own correctly-generated
#    updater manifest fragment
#    (exact bundle filenames/signature format), rather than us hand-rolling
#    that. This release is never advertised to end users and is deleted by
#    the publish job below once its assets are mirrored elsewhere.
#
# 2. `publish` (needs: build, runs once after all 3 platforms finish):
#    downloads every asset from that temporary release via the GitHub API
#    (authenticated with GITHUB_TOKEN — works fine against this repo),
#    rewrites `latest.json`'s URLs to point at our own storage
#    instead of github.com, and uploads everything to a dedicated public
#    Cloud Storage bucket, then deletes the temporary GitHub release + tag.
#
#    Deliberately a GCS bucket, not Firebase Hosting: a Hosting deploy
#    replaces a site's *entire* content on every release, so an independent
#    CI pipeline deploying to the same site as the main app/website would
#    wipe it out on every signer release (and vice versa). GCS uploads are
#    additive, object-by-object — no such risk, and no separate "site" to
#    manage either (just a bucket in the same GCP project the app already
#    uses). Not put behind a Hosting rewrite on the app's own domain either,
#    since that would add a Cloud Function/Run proxy purely to serve large
#    binary downloads — GCS's own public URLs are the simpler, more direct
#    path for this. A friendlier domain can be layered on top later (Cloud
#    CDN + load balancer) without changing anything here.
#
# Required GitHub Secrets (see acta-ordia-signer README for how to obtain):
#   TAURI_SIGNING_PRIVATE_KEY          — from `cargo tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — password for that key (may be empty)
#   GCP_WORKLOAD_IDENTITY_PROVIDER     — full WIF provider resource path
#   GCP_SERVICE_ACCOUNT                — email of the deploying service account
#
# One-time GCP setup (not detailed here — internal infra, not this repo's
# concern): a public GCS bucket for hosting signed bundles, and Workload
# Identity Federation scoped to this org so CI can upload to it without a
# long-lived key. The two secrets above are how that setup is wired in.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libssl-dev libayatana-appindicator3-dev

      - name: Install Rust
        # Pinning to a SHA disables this action's ref-selects-channel trick
        # (dtolnay/rust-toolchain@stable would otherwise install whatever
        # "stable" resolves to) — @master + explicit toolchain: is the
        # documented way to pin the action while keeping that behavior.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-release-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build + sign via tauri-action (staged to a temporary private release)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          # Linux: AppImage + .deb + .rpm. AppImage previously failed here
          # with "failed to run linuxdeploy" (tauri-bundler never surfaced
          # the real cause, and 3 targeted workarounds didn't help) — retried
          # on this exact runner on 2026-10-27 and it built clean with no
          # changes needed, so whatever broke it before is gone now
          # (verified on the real v0.1.2 release run, not just locally).
          # .deb/.rpm stay too, since most Linux users expect a native
          # package regardless — but AppImage is what gives Linux self-update
          # (Tauri's auto-updater only supports AppImage on Linux).
          args: ${{ matrix.platform == 'ubuntu-latest' && '--bundles deb,rpm,appimage' || '' }}
          tagName: staging-${{ github.ref_name }}
          releaseName: 'Internal staging — ${{ github.ref_name }} (not for end users)'
          releaseBody: 'Temporary artifact staging for the publish job. Deleted automatically once mirrored to Cloud Storage.'
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true

  publish:
    name: Mirror to Cloud Storage
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download all assets from the temporary staging release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mirror/${{ github.ref_name }}
          gh release download "staging-${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir mirror/${{ github.ref_name }} \
            --pattern "*"

      - name: Rewrite latest.json URLs to point at our own bucket
        run: |
          # BASE_URL: update this (and tauri.conf.json's updater endpoint) if
          # a custom domain is later put in front of this bucket.
          BASE_URL="https://storage.googleapis.com/acta-ordia-signer-downloads"
          node -e "
            const fs = require('fs');
            const path = 'mirror/${{ github.ref_name }}/latest.json';
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            const base = '${BASE_URL}/signer/${{ github.ref_name }}';
            for (const key of Object.keys(manifest.platforms)) {
              const entry = manifest.platforms[key];
              const filename = entry.url.split('/').pop();
              entry.url = base + '/' + filename;
            }
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2));
          "
          # Also drop a copy at the stable signer/latest.json path
          # tauri.conf.json's updater endpoint points at (always "the
          # current latest release").
          cp "mirror/${{ github.ref_name }}/latest.json" mirror/${{ github.ref_name }}/latest.json.versioned
          mkdir -p mirror-flat
          cp "mirror/${{ github.ref_name }}"/* mirror-flat/

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Upload to gs://acta-ordia-signer-downloads
        run: |
          VERSION_DIR="signer/${{ github.ref_name }}"
          gcloud storage cp mirror-flat/latest.json.versioned "gs://acta-ordia-signer-downloads/${VERSION_DIR}/latest.json"
          for f in mirror-flat/*; do
            [ "$(basename "$f")" = "latest.json.versioned" ] && continue
            gcloud storage cp "$f" "gs://acta-ordia-signer-downloads/${VERSION_DIR}/$(basename "$f")"
          done
          # Stable "always the latest" manifest the updater endpoint checks.
          gcloud storage cp mirror-flat/latest.json.versioned "gs://acta-ordia-signer-downloads/signer/latest.json"

      - name: Publish stable, version-agnostic download links (signer/latest/)
        run: |
          # Every bundled filename embeds the version (e.g.
          # ActaOrdiaSigner_0.1.0_amd64.deb), so a download page can't hardcode
          # a link straight to the versioned path without breaking on the next
          # release. Copy each real artifact to a fixed name under
          # signer/latest/ instead, so the app's download page can link to a
          # stable URL that always resolves to whatever shipped most recently.
          declare -A STABLE_NAMES=(
            ["*.deb"]="ActaOrdiaSigner-linux-amd64.deb"
            ["*.rpm"]="ActaOrdiaSigner-linux-x86_64.rpm"
            ["*x64-setup.exe"]="ActaOrdiaSigner-windows-x64-setup.exe"
            ["*x64_en-US.msi"]="ActaOrdiaSigner-windows-x64.msi"
            ["*aarch64.dmg"]="ActaOrdiaSigner-macos-aarch64.dmg"
          )
          for pattern in "${!STABLE_NAMES[@]}"; do
            match=$(compgen -G "mirror-flat/$pattern" | grep -v '\.sig$' | head -1 || true)
            if [ -n "$match" ]; then
              gcloud storage cp "$match" "gs://acta-ordia-signer-downloads/signer/latest/${STABLE_NAMES[$pattern]}"
            fi
          done

      - name: Delete the temporary staging release + tag
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "staging-${{ github.ref_name }}" --repo "${{ github.repository }}" --yes --cleanup-tag || true
