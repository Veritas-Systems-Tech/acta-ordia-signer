# ============================================
# Test — acta-ordia-signer
# ============================================
# Runs on every push and pull request, across all 3 target platforms —
# Tauri uses a different native webview backend per OS (WebKitGTK on
# Linux, WKWebView on macOS, WebView2 on Windows), so "compiles on Linux"
# does not prove it compiles everywhere.
#
# Jobs:
#   test — cargo build + cargo test + cargo clippy (deny warnings)

name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libssl-dev libayatana-appindicator3-dev

      - name: Install Rust
        # Pinning to a SHA disables this action's ref-selects-channel trick
        # (dtolnay/rust-toolchain@stable would otherwise install whatever
        # "stable" resolves to) — @master + explicit toolchain: is the
        # documented way to pin the action while keeping that behavior.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: cargo build
        working-directory: src-tauri
        run: cargo build --verbose

      # TEMPORARY diagnostic: a bare tauri::test mock app (no plugins, no
      # updater) ALSO crashes with STATUS_ENTRYPOINT_NOT_FOUND — meaning
      # this might not be a test-only problem. Check whether the actual
      # shipped main binary crashes the same way when run for real on
      # Windows (launch it, give it a few seconds, then kill it — if it's
      # still alive after that, it started successfully).
      - name: Check whether the real app binary itself starts on Windows (diagnostic)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "src-tauri\target\debug\acta-ordia-signer.exe"
          Write-Host "Launching: $exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            Write-Host "Process EXITED early with code: $($p.ExitCode) (as unsigned: $('0x{0:X8}' -f [uint32]$p.ExitCode))"
          } else {
            Write-Host "Process is still running after 5s — it started successfully. Killing it."
            Stop-Process -Id $p.Id -Force
          }

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --verbose

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
