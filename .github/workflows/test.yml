# ============================================
# Test — acta-ordia-signer
# ============================================
# Runs on every push and pull request, across all 3 target platforms —
# Tauri uses a different native webview backend per OS (WebKitGTK on
# Linux, WKWebView on macOS, WebView2 on Windows), so "compiles on Linux"
# does not prove it compiles everywhere.
#
# Jobs:
#   test — cargo build + cargo test + cargo clippy (deny warnings)

name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libssl-dev libayatana-appindicator3-dev

      - name: Install Rust
        # Pinning to a SHA disables this action's ref-selects-channel trick
        # (dtolnay/rust-toolchain@stable would otherwise install whatever
        # "stable" resolves to) — @master + explicit toolchain: is the
        # documented way to pin the action while keeping that behavior.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: cargo build
        working-directory: src-tauri
        run: cargo build --verbose

      # TEMPORARY diagnostic (to be removed once the Windows
      # STATUS_ENTRYPOINT_NOT_FOUND crash in updater_integration.exe is
      # root-caused): dumps the exact unresolved import that's crashing the
      # process at load time, which Windows never surfaces in stdout/stderr.
      - name: Set up MSVC dev environment (diagnostic)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Build test binaries without running (diagnostic)
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        run: cargo test --no-run --verbose

      - name: Dump imports of the crashing test binary (diagnostic)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri\target\debug\deps -Filter "updater_integration-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "Inspecting: $($exe.FullName)"
          dumpbin /imports $exe.FullName

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --verbose

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
