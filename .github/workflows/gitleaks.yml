# ============================================
# Secret Scanning — Gitleaks
# ============================================
# Extra-important in this repo specifically: this agent handles private
# keys and .p12 passphrases. Nothing sensitive should ever be committed,
# even in a test fixture.

name: Gitleaks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
