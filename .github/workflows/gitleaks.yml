# ============================================
# Secret Scanning — Gitleaks
# ============================================
# Extra-important in this repo specifically: this agent handles private
# keys and .p12 passphrases. Nothing sensitive should ever be committed,
# even in a test fixture.

name: Gitleaks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action requires a paid GITLEAKS_LICENSE once a repo
      # lives under an organization (free only for personal-account repos) —
      # broke silently when this repo moved orgs. The underlying `gitleaks`
      # CLI itself is MIT-licensed and free regardless; this runs it directly
      # instead of the Action wrapper, so scanning stays free and self-hosted.
      - name: Install gitleaks CLI
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact
