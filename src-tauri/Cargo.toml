[package]
name = "acta-ordia-signer"
version = "0.1.2"
description = "Acta Ordia ICP-Brasil signing agent — signs the CMS digest locally, private key never leaves this process"
edition = "2021"
license = "MIT"
repository = "https://github.com/VeritasSystems/acta-ordia-signer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# Parses A1 .p12 bundles and performs the raw PKCS1v1.5-over-digest sign
# (Rsa::private_encrypt with Padding::PKCS1) — the same primitive verified
# against forge's public-key verify() on the backend side (see cms.ts's
# header in the main repo for why it must be raw-encrypt, not a hashing
# sign call).
#
# `vendored`: builds and statically links OpenSSL from source instead of
# depending on a system install. Not just a CI convenience — a real end-user
# Windows machine essentially never has OpenSSL installed system-wide (this
# was confirmed the hard way: CI's windows-latest job failed outright with
# "Could not find directory of OpenSSL installation" until this was added),
# so an unvendored build would have silently been unshippable on Windows.
# Tradeoff: slower compiles, and this binary now needs its own updates for
# OpenSSL security patches rather than inheriting the OS's.
openssl = { version = "0.10", features = ["vendored"] }
base64 = "0.22"
# Per-session shared secret between /prepare and /sign — see server.rs. OS
# CSPRNG only; version pinned to the 0.3.x line already resolved in Cargo.lock
# (transitively pulled by other deps) to avoid a duplicate getrandom version.
getrandom = "0.3"
# Scrubs the passphrase and raw .p12 bytes from heap memory on drop —
# already transitively in Cargo.lock (1.9.0), promoted to a direct dep.
zeroize = "1"
# Verifies the backend's Ed25519 signature over the digest before the agent
# will sign anything — the real fix for the signature-oracle finding. Only
# the verify side is used (VerifyingKey/Verifier); the embedded public key is
# safe to ship in an open-source binary. Tests generate an ephemeral keypair
# via getrandom (already a dep), so the `rand_core` feature isn't needed.
ed25519-dalek = "2"
# Crash/error reporting — separate Sentry project from the main acta-ordia
# app (different org member, different runtime). Only crash reports and
# coarse error *codes* are ever sent (see telemetry.rs) — never passphrases,
# file paths, or certificate contents. `panic` feature auto-reports Rust
# panics, which matters here specifically because we have zero visibility
# into real end-user machines (no real ICP-Brasil cert has been tested
# against this build yet — see pending-user-actions memory).
sentry = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
# Pins the transitive `uuid` dep (pulled in by tauri-utils/infer/cfb) to the
# last release whose own getrandom requirement is ^0.3 (1.21.0+ moved to
# ^0.4). Without this, the resolver links getrandom 0.2 (via rand/ring),
# 0.3 (direct + tauri's own dep) AND 0.4 (via uuid >=1.21) into the same
# binary. getrandom 0.3 and 0.4's Windows backends both raw-dylib-import
# `ProcessPrng` from bcryptprimitives.dll — two independent declarations of
# that same raw-dylib import in one binary is what crashed
# updater_integration.exe with STATUS_ENTRYPOINT_NOT_FOUND on the real
# windows-latest CI runner (confirmed directly from the job log, not
# guessed — this only surfaced once that test started exercising
# tauri-plugin-updater's download() path, the first code path that actually
# links getrandom 0.4's object code rather than leaving it dead in
# Cargo.lock). getrandom 0.2+0.3 alone already coexist fine — the
# pre-existing 51-test unit binary links both and passes on the same runner.
uuid = "=1.20.0"
# Same reasoning: tempfile 3.25.0+ widened its own getrandom requirement to
# ">=0.3.0, <0.5", so even with uuid pinned above, the resolver was still
# free to pick getrandom 0.4.3 to satisfy tauri-plugin-updater's tempfile
# dep. 3.24.0 is the last release with a strict "^0.3.0" requirement, which
# leaves the resolver no choice but the 0.3 bracket.
tempfile = "=3.24.0"

[dev-dependencies]
url = "2"
# BLAKE2b-512 prehash for tests/updater_integration.rs's own hand-rolled
# minisign-format signer (see that file's `test_minisign` module).
blake2 = "0.10"
# Feature unification pulls this into the main `tauri` dep too, but only for
# test builds (cargo only enables "test" when actually running tests) — it
# gates `tauri::test::{mock_builder, mock_app, ...}`, used by
# tests/updater_integration.rs to build a headless app with no real window.
tauri = { version = "2", features = ["test"] }
